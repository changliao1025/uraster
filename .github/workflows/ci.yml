name: CI

on:
  push:
    branches: [ main, develop, development ]
  pull_request:
    branches: [ main, develop, development ]
  release:
    types: [ published ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v2
      with:
        miniconda-version: "latest"
        auto-update-conda: true
        python-version: ${{ matrix.python-version }}
        channels: conda-forge,defaults
        channel-priority: true

    - name: Install dependencies
      shell: bash -l {0}
      run: |
        # libgdal-arrow-parquet provides the OGR Parquet driver the weighted
        # (mass-conserving) remap needs to write its .geoparquet raster mesh.
        # pyearthviz3d (3D viz) is intentionally omitted: it is imported lazily,
        # is not exercised by the offline test suite, and its gdk-pixbuf
        # post-link script fails to install on Windows.
        conda install -c conda-forge pip numpy gdal libgdal-arrow-parquet pooch pyearth
        conda install -c conda-forge pytest pytest-cov black flake8

    - name: Install package
      shell: bash -l {0}
      run: |
        # --no-deps so pip does not pull pyearthviz3d (declared in pyproject but
        # unused by the tests); all runtime deps are already installed by conda.
        python -m pip install -e . --no-deps

    - name: Lint with flake8
      shell: bash -l {0}
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check code formatting with black
      shell: bash -l {0}
      run: |
        black --check --diff .

    - name: Test with pytest
      shell: bash -l {0}
      run: |
        pytest tests/ -v --cov=uraster --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
