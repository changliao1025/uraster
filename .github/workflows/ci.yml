name: CI Tests

on:
  push:
    branches: [ main, develop, development ]
  pull_request:
    branches: [ main, develop, development ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: uraster-test
          init-shell: bash
          condarc: |
            channels:
              - conda-forge
              - nodefaults
          create-args: >-
            python=${{ matrix.python-version }}
            pip
            numpy
            gdal
            libgdal-arrow-parquet
            pooch
            pyearth>=0.2.5
            pyearthviz3d>=0.1.4
            pyearthmesh>=0.1.2
            pytest
            pytest-cov
          cache-environment: true
          cache-environment-key: micromamba-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}

      - name: Install package
        shell: bash -el {0}
        run: |
          pip install --no-deps -e .

      - name: Run Test Suite
        shell: bash -el {0}
        run: |
          pytest -ra -v --cov=uraster --cov-report=xml tests/

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
