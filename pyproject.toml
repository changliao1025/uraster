[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uraster"
version = "0.1.7"
description = "A Python package for unstructured raster processing and remapping"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Chang Liao", email = "changliao.climate@gmail.com"}
]
maintainers = [
    {name = "Chang Liao", email = "changliao.climate@gmail.com"}
]
keywords = ["raster", "GIS", "geospatial", "GDAL", "unstructured"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: GIS",
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "gdal>=3.0.0",
    "pyearth>=0.2.3",
    "pyearthviz3d>=0.1.2",
    "psutil",
    "pooch",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]
notebook = [
    "tqdm>=4.0.0",
    "ipywidgets>=7.0.0",
    "trame>=2.0.0",
    "trame-vtk>=2.0.0",
    "trame-vuetify>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/changliao1025/uraster"
Documentation = "https://github.com/changliao1025/uraster"
Repository = "https://github.com/changliao1025/uraster"
"Bug Tracker" = "https://github.com/changliao1025/uraster/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["uraster*"]
exclude = ["tests*"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
